[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auditkit"
version = "0.3.0"
description = "Authorized attack-surface audit reporting toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE.txt"}
dependencies = [
    "cryptography>=42",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
auditkit = "auditkit.cli:main"

[tool.setuptools]
packages = [
    "auditkit",
    "auditkit.scanners",
    "auditkit.license",
]
